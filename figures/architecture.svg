<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" width="680" height="424" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>JobAgent 多智能体系统架构图</title>
  <desc>前端经 SSE 连接 LangGraph 编排引擎，引擎内五个 Agent 协作，右侧接四类存储，顶部为 LLM 网关，底部为用户确认节点</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="190" y="16" width="300" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="340" y="33" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">OpenAI 兼容 LLM 网关</text>
  <text x="340" y="51" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">角色 → 模型分层路由（planner / worker / writer / critic / thinking）</text>
  <path d="M340 64 L340 84" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="40" y="190" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="110" y="208" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Next.js 工作台</text>
  <text x="110" y="226" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">SSE 流式渲染</text>
  <path d="M180 218 L201 218" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="205" y="88" width="270" height="250" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="340" y="106" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">LangGraph 多智能体编排</text>

  <rect x="285" y="118" width="110" height="42" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/>
  <text x="340" y="139" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">Planner</text>
  <rect x="220" y="180" width="110" height="42" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/>
  <text x="275" y="201" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">WebSearcher</text>
  <rect x="350" y="180" width="110" height="42" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/>
  <text x="405" y="201" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">Worker</text>
  <rect x="220" y="244" width="110" height="42" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/>
  <text x="275" y="265" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">Writer</text>
  <rect x="350" y="244" width="110" height="42" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/>
  <text x="405" y="265" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">Critic</text>

  <path d="M325 160 L285 178" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M355 160 L395 178" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M275 222 L275 240" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M405 222 L405 240" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M330 265 L346 265" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M405 290 C405 312 285 312 285 290" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">修订回环 ≤2 次</text>

  <rect x="240" y="360" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="340" y="382" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">用户确认 HITL · interrupt</text>
  <path d="M340 338 L340 356" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="495" y="96" width="145" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="567" y="114" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">MySQL 8.0</text>
  <text x="567" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">业务库 + checkpoint</text>
  <rect x="495" y="164" width="145" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="567" y="182" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Qdrant</text>
  <text x="567" y="200" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">BGE 向量 · 人岗匹配</text>
  <rect x="495" y="232" width="145" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="567" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Redis + Celery</text>
  <text x="567" y="268" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">任务队列 · 可降级</text>
  <rect x="495" y="300" width="145" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="567" y="318" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">MinIO</text>
  <text x="567" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">对象存储</text>

  <path d="M475 124 L491 124" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M475 192 L491 192" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M475 260 L491 260" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M475 328 L491 328" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
